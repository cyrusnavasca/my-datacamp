title: max_tokens, stop reasons and temperature
description: How generation stops, how sampling picks each token, and how to fix replies that end mid-sentence.
exercises:
  - id: parameters-slides
    type: video
    title: How generation stops, and how it chooses
    slides: |
      # `max_tokens` is a ceiling, not a target

      The model writes one token at a time. Generation stops at the **first** of:

      | `stop_reason` | what happened | what you do |
      | --- | --- | --- |
      | `end_turn` | the model finished on its own | use the reply |
      | `max_tokens` | it hit your ceiling **mid-thought** | the reply is cut off: handle it |
      | `stop_sequence` | it wrote one of your `stop_sequences` | expected, if you set them |
      | `tool_use` | it wants to call a tool | run the tool (a later course) |

      The model usually can't see your `max_tokens`. Setting it to 50 won't make the model *write* a short answer;
      the answer just gets cut off at 50 tokens. To get shorter answers, **ask** for them in the prompt.

      You pay only for tokens actually generated, so a generous ceiling costs nothing extra unless it's used.

      ---

      ## Temperature: how the next token is picked

      At each step the model scores every token in its vocabulary (the **logits** $z_i$). Sampling turns scores into
      probabilities with a softmax scaled by the temperature $T$:

      $$p_i = \frac{e^{z_i / T}}{\sum_j e^{z_j / T}}$$

      | $T$ | effect |
      | --- | --- |
      | close to 0 | the top token gets almost all the probability: near-greedy, repeatable |
      | 1 | the model's own distribution |
      | above 1 | flatter: more variety, more odd choices |

      `temperature=0` is close to deterministic, but not guaranteed: tiny numerical differences on the server can still
      flip a near-tie. Don't build tests that expect identical text from two calls.

      ---

      ## Choosing settings for the job

      | job | temperature | max_tokens | why |
      | --- | --- | --- | --- |
      | classify a ticket into 5 labels | 0 | small, e.g. 10-20, still above the longest label | repeatable, cheap, a parser reads it |
      | extract fields as JSON | 0 | longest valid object plus headroom | truncated JSON is invalid JSON |
      | answer crew questions | 0-0.5 | a few hundred | factual, but phrasing can vary |
      | brainstorm names for a robot | about 1 | small | variety is the point |
      | long report | 0-0.7 | large, and stream it | cut-off reports are worse than slow ones |

      A ceiling that is too tight causes truncation. A ceiling that is too loose costs nothing on average but raises the
      **worst case**: a runaway reply can take thousands of tokens and many seconds.

      ---

      ## Playbook: "ORBIT's answers stop mid-sentence"

      1. **Measure:** log `stop_reason` for every call. Compute the truncation rate: the share of calls with `max_tokens`.
      2. **Diagnose:** if the truncated calls are the long-answer questions, the ceiling is too low for them.
         If short answers are cut too, the ceiling is far too low, or the prompt is asking for long output.
      3. **Fix**, cheapest first:

      | fix | cost | catch |
      | --- | --- | --- |
      | raise `max_tokens` | none until used | worst-case latency and cost go up |
      | ask for brevity in the prompt | saves tokens | may lose detail the crew needed |
      | retry with a bigger ceiling when cut | pays for the first attempt again | simple, and only slow on the rare long answer |
      | continue: send the partial reply back as an `assistant` turn | extra input tokens | the model picks up where it stopped |

      4. **Verify:** re-run the same questions. The truncation rate should be 0, and every reply should end where the model chose.

  - id: predict-truncation
    type: mc
    title: Predict the cut-off
    question: |
      The console ran
      `response = client.messages.create(model=MODEL, max_tokens=20, system=SYSTEM, messages=[{"role": "user", "content": "What do we do if there is a fire?"}])`.
      ORBIT's full fire answer is about 80 tokens. What do you get?
    context: Predict first, then check `response.stop_reason` and `response.content[0].text` in the console.
    pre_code: |
      import aikit
      from kits.llm_apis_prompting import orbit_chat, MODEL
      SYSTEM = "You are ORBIT, the station assistant on research station Helios-7."
      client = aikit.FakeClaude(orbit_chat(), clock=aikit.VirtualClock())
      response = client.messages.create(model=MODEL, max_tokens=20, system=SYSTEM,
                                        messages=[{"role": "user", "content": "What do we do if there is a fire?"}])
    options:
      - text: "A complete but shorter answer, with `stop_reason == \"end_turn\"`."
        feedback: The model can't see your `max_tokens`, so it doesn't plan a shorter answer. It writes the full answer and gets cut off. Check `response.stop_reason`.
      - text: "The first 20 or so tokens of the full answer, ending mid-sentence, with `stop_reason == \"max_tokens\"`."
        correct: true
        feedback: Right. Generation simply stops at the ceiling. Code that ignores `stop_reason` would show the crew half a fire procedure.
      - text: "An error, because the answer doesn't fit."
        feedback: The API doesn't fail on a long answer. It returns what was generated so far and tells you why it stopped.
      - text: An empty reply, because nothing fits in 20 tokens.
        feedback: Tokens are produced one at a time. The reply holds everything generated before the ceiling was hit.
    hint: Run `print(response.stop_reason)` and `print(response.content[0].text)`.

  - id: temperature-by-hand
    type: coding
    title: Temperature by hand
    context: |
      ORBIT is asked to suggest a name for the new hydroponics robot. For the first token of the name, the model's scores
      (logits) for five candidates are in `logits`, in the same order as `names`. `client` is ORBIT's fake model; it samples
      with whatever `temperature` you pass.
    instructions:
      - "Write `softmax_t(logits, T)` that returns the probabilities $e^{z_i/T} / \\sum_j e^{z_j/T}$ as a NumPy array."
      - Store the probabilities at `T=0.5` in `p_cold` and at `T=2.0` in `p_hot`.
      - "Ask `client` 20 times with `temperature=0` and 20 times with `temperature=1.0` (user message: `Suggest a name for the new hydroponics robot.`). Store how many **distinct** replies each gave in `distinct_t0` and `distinct_t1`."
    hint: |
      `np.exp(logits / T)` then divide by its sum. For the distinct replies, collect `.content[0].text` from each call
      in a list and use `len(set(replies))`.
    pre_code: |
      import numpy as np
      import aikit
      from kits.llm_apis_prompting import orbit_chat, MODEL
      client = aikit.FakeClaude(orbit_chat(), clock=aikit.VirtualClock())
      names = ["Sprout", "Leafy", "Hydra", "Botbot", "Kelp-9"]
      logits = np.array([2.0, 1.3, 0.9, 0.4, 0.1])
      PROMPT = "Suggest a name for the new hydroponics robot."
    sample_code: |
      def softmax_t(logits, T):
          e = ____
          return ____

      p_cold = softmax_t(logits, ____)
      p_hot = softmax_t(logits, ____)
      print(np.round(p_cold, 3), np.round(p_hot, 3))

      def ask(temperature):
          r = client.messages.create(model=MODEL, max_tokens=50, temperature=temperature,
                                     messages=[{"role": "user", "content": PROMPT}])
          return r.content[0].text

      distinct_t0 = len(set(____))
      distinct_t1 = len(set(____))
      print(distinct_t0, distinct_t1)
    solution: |
      def softmax_t(logits, T):
          e = np.exp(logits / T)
          return e / e.sum()

      p_cold = softmax_t(logits, 0.5)
      p_hot = softmax_t(logits, 2.0)
      print(np.round(p_cold, 3), np.round(p_hot, 3))

      def ask(temperature):
          r = client.messages.create(model=MODEL, max_tokens=50, temperature=temperature,
                                     messages=[{"role": "user", "content": PROMPT}])
          return r.content[0].text

      distinct_t0 = len(set(ask(0) for _ in range(20)))
      distinct_t1 = len(set(ask(1.0) for _ in range(20)))
      print(distinct_t0, distinct_t1)
    tests: |
      check_object("softmax_t")
      import numpy as np
      p = user["softmax_t"](np.array([1.0, 0.0]), 1.0)
      assert abs(float(np.sum(p)) - 1) < 1e-6, "`softmax_t` should return probabilities that sum to 1: divide by the sum."
      check_equal("p_cold", msg="`p_cold` should be `softmax_t(logits, 0.5)`.")
      check_equal("p_hot", msg="`p_hot` should be `softmax_t(logits, 2.0)`.")
      check_equal("distinct_t0", 1, msg="At temperature 0 the model should give the same reply every time. Did you pass `temperature=0`?")
      assert user.get("distinct_t1", 0) >= 3, "At temperature 1.0 you should see several different names. Count distinct texts over 20 calls with `temperature=1.0`."
    success_msg: |
      At T=0.5 the top name gets most of the probability; at T=2 the distribution flattens out. That's why
      extraction and classification run cold, and brainstorming runs warm.

  - id: fix-truncation
    type: coding
    title: "Troubleshoot: answers cut off mid-sentence"
    context: |
      Crew members complain that ORBIT "stops talking halfway". The production code calls the model with
      `max_tokens=60`. `CREW_QUESTIONS` holds 8 real questions from the logs, `client` is ORBIT's model and `SYSTEM` its prompt.
    instructions:
      - "**Measure:** ask every question with `max_tokens=60`. Store the share of replies whose `stop_reason` is `\"max_tokens\"` in `truncation_rate`."
      - "**Fix:** write `ask(question)` that returns ORBIT's complete answer text. Any fix works: a higher ceiling, retrying with a bigger one, or continuing the reply."
      - "**Verify:** store `[ask(q) for q in CREW_QUESTIONS]` in `answers`, and the truncation rate of your fixed version in `fixed_rate`."
    hint: |
      One retry-based fix: start at `max_tokens=60`; while `r.stop_reason == "max_tokens"`, double the ceiling and call again.
      To measure `fixed_rate`, have `ask` record the final `stop_reason` of each question in a list.
    pre_code: |
      import aikit
      from kits.llm_apis_prompting import orbit_chat, orbit_answer, CREW_QUESTIONS, MODEL
      client = aikit.FakeClaude(orbit_chat(), clock=aikit.VirtualClock())
      SYSTEM = "You are ORBIT, the station assistant on research station Helios-7."

      def call(question, max_tokens):
          return client.messages.create(model=MODEL, max_tokens=max_tokens, system=SYSTEM,
                                        messages=[{"role": "user", "content": question}])
    sample_code: |
      # Measure
      replies = [call(q, 60) for q in CREW_QUESTIONS]
      truncation_rate = ____

      # Fix
      final_reasons = []

      def ask(question):
          max_tokens = 60
          r = call(question, max_tokens)
          while ____:
              max_tokens = ____
              r = call(question, max_tokens)
          final_reasons.append(r.stop_reason)
          return r.content[0].text

      # Verify
      answers = [ask(q) for q in CREW_QUESTIONS]
      fixed_rate = ____
      print(truncation_rate, fixed_rate)
    solution: |
      # Measure
      replies = [call(q, 60) for q in CREW_QUESTIONS]
      truncation_rate = sum(r.stop_reason == "max_tokens" for r in replies) / len(replies)

      # Fix
      final_reasons = []

      def ask(question):
          max_tokens = 60
          r = call(question, max_tokens)
          while r.stop_reason == "max_tokens" and max_tokens < 1000:
              max_tokens = max_tokens * 2
              r = call(question, max_tokens)
          final_reasons.append(r.stop_reason)
          return r.content[0].text

      # Verify
      answers = [ask(q) for q in CREW_QUESTIONS]
      fixed_rate = final_reasons.count("max_tokens") / len(final_reasons)
      print(truncation_rate, fixed_rate)
    tests: |
      check_equal("truncation_rate", 0.5, msg="`truncation_rate` should be the share of the 8 replies with `stop_reason == 'max_tokens'` at `max_tokens=60`.")
      check_object("answers")
      from kits.llm_apis_prompting import orbit_answer, CREW_QUESTIONS
      full = [orbit_answer(q) for q in CREW_QUESTIONS]
      got = user["answers"]
      assert isinstance(got, list) and len(got) == len(full), "`answers` should hold one answer per question in `CREW_QUESTIONS`."
      cut = [i for i, (a, f) in enumerate(zip(got, full)) if "".join(a.split()) != "".join(f.split())]
      assert not cut, f"Answers {cut} are still incomplete or different from ORBIT's full answer. Check that `ask` returns the text of the final, untruncated reply."
      check_equal("fixed_rate", 0, msg="After the fix no question should end with `stop_reason == 'max_tokens'`. Compute `fixed_rate` from the final replies.")
    success_msg: |
      Half the questions were truncated, and the fix brought that to zero. The retry approach only spends extra
      on the long answers; raising the ceiling for every call would have been simpler but raises the worst case.

  - id: choose-settings
    type: mc
    title: Settings for the night-shift labeller
    question: |
      Overnight, ORBIT will label 5,000 crew tickets. A parser reads each reply and expects exactly one of
      `maintenance`, `it`, `supplies`, `scheduling` or `medical`. Unparseable replies go to a human. Which settings fit best?
    options:
      - text: "`temperature=0`, `max_tokens=10`, and a prompt that says to reply with only the label."
        correct: true
        feedback: "Right. Cold sampling keeps labels repeatable, the ceiling is above the longest label but stops rambling early, and the prompt asks for a bare label. That's cheap and parseable."
      - text: "`temperature=1`, `max_tokens=1000`, so the model can explain its choice."
        feedback: Explanations break the parser, and temperature 1 makes borderline tickets flip between labels from run to run. You also pay for every explanation token, 5,000 times.
      - text: "`temperature=0`, `max_tokens=1`, because a label is one word."
        feedback: A word isn't always one token. A label like `maintenance` can be split into several tokens, so it could be cut to something like `mainten` with `stop_reason == "max_tokens"`, which the parser rejects. Leave headroom above the longest label.
      - text: "`temperature=2`, `max_tokens=10`, to explore labels the model wouldn't normally pick."
        feedback: High temperature adds randomness, not insight. For a fixed label set it just raises the error rate.
    hint: Think about the parser first, then repeatability, then cost.
