title: Building a golden set
description: What goes into an evaluation set, where the cases come from, how many you need, and how to sample so small categories aren't drowned out.
exercises:
  - id: golden-set-slides
    type: video
    title: A test set for an LLM app
    slides: |
      # What a golden set is

      A **golden set** is a fixed list of inputs with what a good output looks like. Each case also carries metadata,
      so you can slice results later:

      ```json
      {"id": "q06", "question": "What humidity range is normal in hydroponics?",
       "answer": "Between 60% and 75%.", "doc_ids": ["hydroponics-troubleshooting"],
       "type": "factual", "source": "handbook", "added": "2026-09-02"}
      {"id": "q42", "question": "What is the Wi-Fi password?",
       "answer": null, "doc_ids": [], "type": "unanswerable", "source": "error-analysis"}
      ```

      `aikit.helios.questions()` is ORBIT's first golden set: 45 cases with gold answers and gold documents. The
      reference can be an exact answer, a list of key facts, or `null` meaning "the right behaviour is to refuse".

      ---

      ## Coverage beats size

      Every case should test something. Cover each axis your error analysis turned up:

      - **Type**: factual, multi-hop (two documents), unanswerable.
      - **Topic**: every handbook section, not just the ones you tested by hand.
      - **Traps**: superseded documents, misleading premises ("When did ORBIT last open the airlock?"), injections.

      | where cases come from | realism | cost | coverage | risk |
      | --- | --- | --- | --- | --- |
      | production logs | highest | needs labelling | whatever users ask | rare cases are rare |
      | failures from error analysis | high | cheap: you already read them | the known weak spots | overfits to the past |
      | written by domain experts | high | expensive | targeted edge cases | slow to grow |
      | generated by an LLM | low to medium | cheapest | broad but samey | too easy; answerable by construction |

      A good mix: production samples for realism, expert-written cases for edge cases, synthetic cases only after a
      human has reviewed them.

      ---

      ## How many cases?

      An accuracy measured on $n$ cases is itself an estimate. Its standard error is
      $\text{SE} = \sqrt{p(1-p)/n}$, and a 95% interval is about $p \pm 1.96\,\text{SE}$.

      | cases $n$ | margin at $p = 0.8$ |
      | --- | --- |
      | 20 | ±17.5 points |
      | 45 | ±11.7 points |
      | 100 | ±7.8 points |
      | 250 | ±5.0 points |
      | 1,000 | ±2.5 points |

      Halving the margin takes **4×** the cases, and every case costs model calls, judge calls and expert time on each
      run. The size question is: how small a change do I need to detect, and what can I afford per run?

      ---

      ## Stratify, then reweight

      A random sample of ORBIT's 45 questions mostly gives factual ones: only 4 are unanswerable. **Stratified
      sampling** fixes how many cases you take from each group:

      ```python
      golden = qs.groupby("type").sample(n=4, random_state=0)      # 4 of each type
      ```

      Then a single overall number needs **reweighting** to match the real traffic mix, because the set no longer
      matches it:

      $$\text{overall} = \sum_{t} \text{share}_t \times \text{accuracy}_t$$

      Report per-type accuracies as well as the overall number. The overall number is what the crew experiences; the
      per-type numbers are what you fix.

      ---

      ## Keep the set honest

      - **Dev / test split.** Tune prompts on dev; look at test only to report. If you tune on everything, your score is a
        memory test.
      - **Version it** like code. A score is only comparable on the same set version.
      - **Grow it from failures.** Every production failure becomes a case, tagged with its taxonomy category.
      - **Re-check references** when sources change. When the 2026 airlock procedure replaced the 2024 one, every
        "5 minutes" gold answer became wrong.

  - id: stratified-sample
    type: coding
    title: A stratified golden set
    context: |
      `qs` holds ORBIT's 45 questions with a `type` column: 37 `factual`, 4 `multi-hop` and 4 `unanswerable`. You want a
      small, balanced set for quick runs.
    instructions:
      - Store `qs["type"].value_counts()` in `full_counts` to see the imbalance.
      - Build `golden` with exactly **4 questions of each type**, sampled with `random_state=0`.
      - Store the number of rows per type in `golden` in `golden_counts`.
    hint: |
      `qs.groupby("type").sample(n=4, random_state=0)` takes 4 rows from every group.
    pre_code: |
      import pandas as pd
      from kits.llm_evaluation import questions_df
      qs = questions_df()
    sample_code: |
      full_counts = ____
      print(full_counts)

      golden = ____
      golden_counts = golden["type"].value_counts()
      print(golden_counts)
    solution: |
      full_counts = qs["type"].value_counts()
      print(full_counts)

      golden = qs.groupby("type").sample(n=4, random_state=0)
      golden_counts = golden["type"].value_counts()
      print(golden_counts)
    tests: |
      check_object("full_counts")
      assert dict(user["full_counts"]) == {"factual": 37, "multi-hop": 4, "unanswerable": 4}, "`full_counts` should be `qs['type'].value_counts()`."
      check_object("golden")
      g = user["golden"]
      assert len(g) == 12, f"`golden` should have 12 rows (4 per type), it has {len(g)}."
      assert g["id"].is_unique and set(g["id"]) <= set(user["qs"]["id"]), "`golden` should contain distinct rows taken from `qs`."
      assert dict(g["type"].value_counts()) == {"factual": 4, "multi-hop": 4, "unanswerable": 4}, "Take exactly 4 questions of each type: group by `type`, then `.sample(n=4, ...)`."
      check_object("golden_counts")
      assert dict(user["golden_counts"]) == {"factual": 4, "multi-hop": 4, "unanswerable": 4}, "`golden_counts` should count rows per type in `golden`."
    success_msg: |
      A third of this set is unanswerable, against 9% in the full list. That's the point: it makes the refusal
      behaviour visible. Remember to reweight before you report one overall number.

  - id: margin-of-error
    type: coding
    title: How many questions do you need?
    context: |
      ORBIT gets about 80% of questions right. Before you ask the commander to write more cases, work out how precise
      an accuracy estimate is at different set sizes.
    instructions:
      - Write `margin(p, n)` that returns the 95% margin of error, $1.96\sqrt{p(1-p)/n}$.
      - Store a dict `margins` mapping each `n` in `[20, 45, 100, 400]` to `margin(0.8, n)`.
      - Store in `n_needed` the smallest whole number of cases that gives a margin of at most 0.05 at `p = 0.8`.
    hint: |
      Solve $1.96\sqrt{p(1-p)/n} \le 0.05$ for $n$: $n \ge 1.96^2\,p(1-p)/0.05^2$, then round **up** with `math.ceil`.
      A loop that increases `n` until `margin(0.8, n) <= 0.05` works too.
    pre_code: |
      import math
    sample_code: |
      def margin(p, n):
          return ____

      margins = {n: ____ for n in [20, 45, 100, 400]}
      print(margins)

      n_needed = ____
      print(n_needed)
    solution: |
      def margin(p, n):
          return 1.96 * math.sqrt(p * (1 - p) / n)

      margins = {n: margin(0.8, n) for n in [20, 45, 100, 400]}
      print(margins)

      n_needed = math.ceil(1.96 ** 2 * 0.8 * 0.2 / 0.05 ** 2)
      print(n_needed)
    tests: |
      check_object("margin")
      assert abs(user["margin"](0.5, 100) - 0.098) < 1e-6, "`margin(0.5, 100)` should be 1.96 * sqrt(0.25 / 100) = 0.098."
      check_object("margins")
      m = user["margins"]
      assert sorted(m) == [20, 45, 100, 400], "`margins` needs the keys 20, 45, 100 and 400."
      for n, v in sol["margins"].items():
          assert abs(m[n] - v) < 1e-6, f"`margins[{n}]` should be margin(0.8, {n}) = {v:.4f}, got {m[n]}."
      check_equal("n_needed", msg="`n_needed` should be the smallest n with margin(0.8, n) <= 0.05. Round up, don't round to nearest.")
    success_msg: |
      With 45 questions the margin is about ±12 points, wider than most of the changes you'll want to detect. 246
      cases gets you to ±5. That's why per-slice results from 4 questions are anecdotes, not measurements.

  - id: dataset-strategy
    type: mc
    title: Spend the expert's time well
    question: |
      ORBIT v3 ships in two days. The worry: the new prompt makes ORBIT answer questions the handbook can't answer. You
      have the 45-question set (4 unanswerable), the commander for **2 hours**, and an LLM you can use to generate
      questions. Which plan gives the most trustworthy answer to *that* worry?
    options:
      - text: Generate 500 questions with an LLM from the handbook docs and run them all.
        feedback: |
          Questions generated *from* the documents are answerable by construction, so they barely test refusal. And 500
          unreviewed synthetic cases need checking before you trust them. Cheap, but it measures the wrong thing.
      - text: Have the commander write about 30 questions the handbook can't answer, plus near-misses on real topics, and add them tagged `unanswerable`.
        correct: true
        feedback: |
          Yes. It targets the risk directly, and 2 hours of expert time is enough for 30 realistic cases. Near-misses
          ("What is the dentist's schedule?" next to real medical docs) are where ORBIT would be tempted to answer. With
          about 34 unanswerable cases the refusal rate is measured within about ±15 points, against about ±40 with 4.
      - text: Run the existing 45 questions and compare overall accuracy with v2.
        feedback: |
          Only 4 unanswerable questions: one changed answer moves that slice by 25 points, and the overall number hides
          it under 37 factual questions. You'd be measuring the wrong slice with almost no data.
      - text: Pull 1,000 production conversations and have the commander label all of them.
        feedback: |
          Realistic, but 1,000 labels in 2 hours is about 7 seconds each, and only ~1 in 5 would be unanswerable anyway.
          Use the expert where they add the most: targeted cases for the risk you're worried about.
    hint: Which plan puts the most well-made unanswerable cases in front of v3 within the expert's two hours?
