  - id: harness
    type: coding
    title: Run v1 and v2 through your harness
    context: |
      `cases` is the 45-question golden set as a list of dicts (`id`, `question`, `type`, ...). `systems` maps `"v1"` and
      `"v2"` to functions that take a question and return `{"answer": ..., "retrieved": [...]}`. `scorers` has
      `correct` (the key-facts check you validated) and `cited` (the answer refuses or has a `[doc-id]` citation).
    instructions:
      - "Write `run_eval(systems, cases, scorers)` returning a DataFrame with one row per (system, case) and the columns `system`, `id`, `type`, `answer` plus one column per scorer."
      - Run it and store the table in `results` (90 rows).
      - Store the mean `correct` per system in `overall`, and `results.pivot_table(index="type", columns="system", values="correct")` in `summary`.
    hint: |
      Follow the loop from the slides: `out = system(case["question"])`, then `row[score_name] = scorer(case, out)`.
    pre_code: |
      import re
      import pandas as pd
      from kits.llm_evaluation import make_orbit, questions_df, key_facts_pass
      cases = questions_df().to_dict("records")
      systems = {"v1": make_orbit("v1").answer, "v2": make_orbit("v2").answer}
      scorers = {
          "correct": lambda case, out: key_facts_pass(case["id"], out["answer"]),
          "cited": lambda case, out: int("I don't know" in out["answer"] or bool(re.search(r"\[[a-z0-9-]+\]", out["answer"]))),
      }
