                  out = ____
                  row = {"system": name, "id": case["id"], "type": case["type"], "answer": out["answer"]}
                  for score_name, scorer in scorers.items():
                      row[score_name] = ____
                  rows.append(row)
          return pd.DataFrame(rows)

      results = run_eval(systems, cases, scorers)
      overall = ____
      summary = ____
      print(overall, summary, sep="\n\n")
    solution: |
      def run_eval(systems, cases, scorers):
          rows = []
          for name, system in systems.items():
              for case in cases:
                  out = system(case["question"])
                  row = {"system": name, "id": case["id"], "type": case["type"], "answer": out["answer"]}
                  for score_name, scorer in scorers.items():
                      row[score_name] = scorer(case, out)
                  rows.append(row)
          return pd.DataFrame(rows)

      results = run_eval(systems, cases, scorers)
      overall = results.groupby("system")["correct"].mean()
      summary = results.pivot_table(index="type", columns="system", values="correct")
      print(overall, summary, sep="\n\n")
    tests: |
      check_object("results")
      r = user["results"]
      assert len(r) == 90, f"`results` should have 90 rows (2 systems × 45 cases), it has {len(r)}."
      for c in ["system", "id", "type", "answer", "correct", "cited"]:
          assert c in r.columns, f"`results` is missing the `{c}` column."
      s = sol["results"]
      assert list(r.sort_values(["system", "id"])["correct"]) == list(s.sort_values(["system", "id"])["correct"]), "The `correct` column doesn't match. Call each scorer with `(case, out)`."
      check_object("overall")
      assert dict(user["overall"].round(6)) == dict(sol["overall"].round(6)), "`overall` should be `results.groupby('system')['correct'].mean()`."
      check_object("summary")
      assert user["summary"].round(6).equals(sol["summary"].round(6)), "`summary` should be the pivot table of mean `correct` by type (rows) and system (columns)."
    success_msg: |
      v2 beats v1 on factual questions (84% vs 73%) and ties on the other slices. Any future change, whether a prompt,
      a retriever or a model, plugs into the same function and produces the same table.

  - id: cost-per-correct
    type: coding
    title: Is more context worth it?
    context: |
      A teammate wants to retrieve 5 documents per question instead of 3, "to be safe". `configs` maps `"k=1"`, `"k=3"` and
      `"k=5"` to ORBIT systems that differ only in `k`. Each has its own fake client, so `orbit.client.total_cost()` gives
      what its calls cost (illustrative prices). `cases` and `key_facts_pass` are loaded.
    instructions:
      - "For each config, answer all `cases` and store the accuracy (mean of `key_facts_pass(case['id'], answer)`) in the dict `acc`, and `orbit.client.total_cost()` in the dict `cost`."
      - Store total cost divided by the number of correct answers in the dict `cost_per_correct`.
      - "Store in `choice` the config with the **lowest cost per correct answer** among those within 0.01 of the best accuracy."
    hint: |
      Number correct = `acc[name] * len(cases)`. For the choice: `best = max(acc.values())`, then
      `min((n for n in acc if acc[n] >= best - 0.01), key=cost_per_correct.get)`.
    pre_code: |
      from kits.llm_evaluation import make_orbit, questions_df, key_facts_pass
      cases = questions_df().to_dict("records")
      configs = {f"k={k}": make_orbit("v2", k=k) for k in (1, 3, 5)}
    sample_code: |
      acc, cost, cost_per_correct = {}, {}, {}
      for name, orbit in configs.items():
          scores = [key_facts_pass(case["id"], orbit.answer(case["question"])["answer"]) for case in cases]
          acc[name] = ____
          cost[name] = ____
          cost_per_correct[name] = ____

      best = max(acc.values())
      choice = ____
      print(acc, cost, cost_per_correct, choice, sep="\n")
    solution: |
      acc, cost, cost_per_correct = {}, {}, {}
      for name, orbit in configs.items():
          scores = [key_facts_pass(case["id"], orbit.answer(case["question"])["answer"]) for case in cases]
          acc[name] = sum(scores) / len(scores)
          cost[name] = orbit.client.total_cost()
          cost_per_correct[name] = cost[name] / sum(scores)

      best = max(acc.values())
      choice = min((n for n in acc if acc[n] >= best - 0.01), key=cost_per_correct.get)
      print(acc, cost, cost_per_correct, choice, sep="\n")
    tests: |
      for d in ("acc", "cost", "cost_per_correct"):
          check_object(d)
          for k, v in sol[d].items():
              assert k in user[d] and abs(user[d][k] - v) < 1e-9, f"`{d}['{k}']` should be {v:.6f}."
      check_equal("choice", msg="`choice` should be the config with the lowest cost per correct answer among those within 0.01 of the best accuracy.")
    success_msg: |
      k=5 gets exactly the same answers right as k=3 and costs about 46% more, because every extra document is input
      tokens on every call. k=1 is cheapest per call but loses 4 questions. Without a harness, "to be safe" would have
      shipped.
