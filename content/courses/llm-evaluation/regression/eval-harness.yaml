title: An eval harness from scratch
description: Dataset × systems × scorers → one results table. Build the loop yourself, slice the results, and add cost so you can compare versions on value as well as accuracy.
exercises:
  - id: harness-slides
    type: video
    title: One loop, one table
    slides: |
      # What an eval harness is

      Everything so far comes together in one loop:

      - a **dataset** of cases (your golden set),
      - one or more **systems** (ORBIT v1, v2, a candidate prompt, a different model),
      - **scorers** (code checks, validated metrics, a calibrated judge),

      and the output is a **results table** with one row per (system, case) and one column per score.

      Eval frameworks (promptfoo, Inspect, Braintrust, LangSmith, ...) all have this shape. Build it once by hand and
      you'll know what they're doing for you.

      ---

      ## The loop

      ```python
      def run_eval(systems, cases, scorers):
          rows = []
          for name, system in systems.items():
              for case in cases:
                  out = system(case["question"])               # {"answer": ..., "retrieved": [...]}
                  row = {"system": name, "id": case["id"], "type": case["type"], "answer": out["answer"]}
                  for score_name, scorer in scorers.items():
                      row[score_name] = scorer(case, out)
                  rows.append(row)
          return pd.DataFrame(rows)
      ```

      A system is anything that maps an input to an output, so a prompt change, a retrieval setting and a new model all
      plug into the same harness.

      ---

      ## Slice the table

      ```python
      results.groupby("system")["correct"].mean()                  # headline
      results.pivot_table(index="type", columns="system", values="correct")   # per slice
      ```

      Add **cost and latency** columns from the client's call log. Accuracy alone can't tell you that a change costs 46%
      more for the same answers. **Cost per correct answer** = total cost / number correct puts value in one number.

      ---

      ## Running it for real

      - **Cache outputs** keyed by (system version, input). Re-scoring with a new metric then costs nothing.
      - **Determinism**: temperature 0 and fixed retrieval, so a re-run measures the change and not the dice.
      - **Store every run** with the commit, prompt hash, model, date and dataset version.

      | run | cases | when | cost and time | catches |
      | --- | --- | --- | --- | --- |
      | smoke | 20-50 | every commit | cents, about a minute | crashes, format breaks, big regressions |
      | full | everything | nightly or before release | dollars, minutes to hours | slice regressions, small shifts |
      | online | production traffic | continuously | labelling and monitoring | what the golden set doesn't cover |

      Offline evals are fast and repeatable but only cover the cases you wrote down. Production monitoring is realistic
      but slow and noisy. You need both.

