      chapter you'll find out which one to believe, and why.

  - id: f1-trap
    type: mc
    title: Which answer scores higher?
    question: |
      The gold answer is `8 minutes at 0.7 bar.` Which ORBIT answer gets the **higher token F1**?

      - **A**: `Lower the airlock pressure to 0.7 bar and hold for 8 minutes as a leak check.`
      - **B**: `5 minutes at 0.7 bar.`
    context: The console has `normalize` and `token_f1` loaded. Predict first, then check with `token_f1(A, gold)`.
    pre_code: |
      import re
      import string
      from collections import Counter

      def normalize(text):
          text = text.lower()
          text = "".join(ch for ch in text if ch not in string.punctuation)
          text = re.sub(r"\b(a|an|the)\b", " ", text)
          return " ".join(text.split())

      def token_f1(pred, gold):
          p, g = normalize(pred).split(), normalize(gold).split()
          same = sum((Counter(p) & Counter(g)).values())
          if same == 0:
              return 0.0
          precision, recall = same / len(p), same / len(g)
          return 2 * precision * recall / (precision + recall)

      gold = "8 minutes at 0.7 bar."
      A = "Lower the airlock pressure to 0.7 bar and hold for 8 minutes as a leak check."
      B = "5 minutes at 0.7 bar."
    options:
      - text: "A, because it contains the correct number."
        feedback: |
          A is the correct answer, but F1 doesn't know which token matters. A has 14 tokens and only 4 are in the gold
          answer, so precision is 0.29 and F1 is about 0.42. Run `token_f1(A, gold)`.
      - text: "B, even though its number is wrong."
        correct: true
        feedback: |
          Right: B shares 4 of its 5 tokens with the gold answer, so F1 = 0.8, nearly double A's 0.42. One wrong number
          out of five tokens costs only 20%. This is why F1 alone can't grade factual answers where one token decides
          right from wrong.
      - text: "They tie, because both contain 0.7 bar."
        feedback: |
          Both share "07" and "bar", but F1 also divides by length. A is much longer, so its precision is far lower.
          Compute both in the console.
      - text: "Both score 0, because neither matches exactly."
        feedback: |
          That's exact match. F1 gives partial credit for overlapping tokens, so both score above 0.
    hint: F1 rewards overlap and punishes length. Count the tokens on each side.
