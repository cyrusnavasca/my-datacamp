      assert abs(f("5 minutes at 0.7 bar.", "8 minutes at 0.7 bar.") - 0.8) < 1e-9, "token_f1('5 minutes at 0.7 bar.', '8 minutes at 0.7 bar.') should be 0.8: 4 of 5 tokens shared on each side."
      assert f("nothing shared", "every week") == 0.0, "Return 0.0 when no tokens are shared."
      assert abs(f("week week week", "week") - 0.5) < 1e-9, "Count shared tokens with multiplicity using `Counter(p) & Counter(g)`."
