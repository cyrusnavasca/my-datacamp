          def measure(runner):
              start = client.total_cost()
              oks, steps, repeats, n_calls = [], [], 0, 0
              for task in TASKS:
                  out = runner(task)
                  oks.append(task_ok(task, out["answer"]))
                  steps.append(out["steps"])
                  seen = set()
                  for name, inp in out["calls"]:
                      key = (name, json.dumps(inp, sort_keys=True))
                      if key in seen:
                          repeats += 1
                      seen.add(key)
                  n_calls += len(out["calls"])
              return {"success": sum(oks) / len(oks), "mean_steps": sum(steps) / len(steps),
                      "repeat_rate": repeats / max(1, n_calls), "cost": client.total_cost() - start}

